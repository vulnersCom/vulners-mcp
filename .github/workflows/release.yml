name: Release

# Every push to main publishes the Docker image to GHCR (`latest`,
# `<version>`, `sha-<commit>`). When `version` in pyproject.toml is new,
# the package also goes to PyPI and server.json to the MCP Registry.
# Pull requests run the tests and build the image without pushing it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/vulnerscom/vulners-mcp
  POETRY_VERSION: "2.2.0"
  MCP_PUBLISHER_VERSION: "1.8.1"
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install "poetry==${POETRY_VERSION}"
      - run: poetry install --no-ansi --with dev
      - run: poetry run ruff check .
      - run: poetry run pytest -q

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      pypi_new: ${{ steps.version.outputs.pypi_new }}
      registry_new: ${{ steps.version.outputs.registry_new }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          name=$(jq -r .name server.json)
          pypi=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/vulners-mcp/${version}/json")
          registry=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0.1/servers/$(jq -rn --arg n "$name" '$n|@uri')/versions/${version}")
          echo "version=${version} pypi=${pypi} registry=${registry}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "pypi_new=$([ "$pypi" = 404 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "registry_new=$([ "$registry" = 404 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  docker:
    needs: [test, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ env.PUBLISH }}
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ env.PUBLISH }}
            type=sha
          labels: |
            org.opencontainers.image.title=vulners-mcp
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pypi:
    needs: [test, version]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.version.outputs.pypi_new == 'true'
    runs-on: ubuntu-latest
    # PyPI trusted publisher: owner vulnersCom, repo vulners-mcp,
    # workflow release.yml, environment pypi.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install "poetry==${POETRY_VERSION}"
      - run: poetry build --no-ansi
      - uses: pypa/gh-action-pypi-publish@release/v1

  registry:
    needs: [version, docker, pypi]
    # pypi is skipped when this version is already on PyPI
    if: >-
      always()
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && needs.version.outputs.registry_new == 'true'
      && needs.docker.result == 'success'
      && (needs.pypi.result == 'success' || needs.pypi.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # The registry verifies the PyPI package right away; a fresh upload
      # can take a moment to show up in the PyPI JSON API.
      - name: Wait for PyPI
        run: |
          url="https://pypi.org/pypi/vulners-mcp/${{ needs.version.outputs.version }}/json"
          for _ in $(seq 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$url")" = 200 ] && exit 0
            sleep 10
          done
          echo "::error::vulners-mcp ${{ needs.version.outputs.version }} is not on PyPI"
          exit 1
      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
