[project]
name = "vulners-mcp"
version = "1.13.0"
description = "MCP interface server fronting the Vulners API (https://vulners.com)"
readme = "README.md"
authors = [{name = "Vulners Team", email = "dev@vulners.com"}]
keywords = ["MCP", "security", "network", "vulners", "vulnerability", "CVE"]
requires-python = ">=3.13,<4.0"
dependencies = [
    "mcp[cli] (>=1.28.1,<2.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic (>=2.10,<3.0)",
    "starlette (>=0.48.0,<1.0)",
    "uvicorn (>=0.35.0,<1.0)",
    "fastmcp (>=2.14.7,<3.0.0)",
    "pydantic-settings (>=2.11.0,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = "^0.13.2"
pytest = "^9.1"
pytest-asyncio = "^1.4"
respx = "^0.23"
pytest-cov = "^7.1"
jsonschema = "^4.26"
openai-agents = ">=0.20,<0.23"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

