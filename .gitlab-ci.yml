include:
  - project: 'infra/gitlab-ci'
    ref: main
    file: deploy.yaml

variables:
  COMMIT_IMAGE: ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}
  LATEST_IMAGE: ${CI_REGISTRY_IMAGE}:latest

stages:
  - test
  - build
  - deploy
  - sync

test:
  stage: test
  image: python:3.14-slim
  variables:
    POETRY_VERSION: "2.2.0"
  before_script:
    - pip install "poetry==${POETRY_VERSION}"
    - poetry install --no-ansi --with dev
  script:
    - poetry run ruff check .
    - poetry run pytest -q --cov=vulners_mcp --cov-report=term-missing

build:
  extends: .build-template

deploy:prod:
  extends: .deploy_template_argocd
  needs: ["build"]
  stage: deploy
  variables:
    APP: vulners_mcp
    TARGET_IMAGE: ${COMMIT_IMAGE}

sync:prod:api:
  extends: .deploy_cluster_sync_template
  stage: sync
  needs: ["deploy:prod"]