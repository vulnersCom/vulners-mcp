include:
  - project: 'infra/gitlab-ci'
    ref: main
    file: deploy.yaml
  - template: Jobs/Container-Scanning.gitlab-ci.yml

variables:
  COMMIT_IMAGE: ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}
  LATEST_IMAGE: ${CI_REGISTRY_IMAGE}:latest

stages:
  - test
  - build
  - scan
  - deploy
  - sync

test:
  stage: test
  image: python:3.14-slim
  variables:
    POETRY_VERSION: "2.2.0"
  before_script:
    - pip install "poetry==${POETRY_VERSION}"
    - poetry install --no-ansi --with dev
  script:
    - poetry run ruff check .
    - poetry run pytest -q --cov=vulners_mcp --cov-report=term-missing

build:
  extends: .build-template

container_scanning:
  stage: scan
  needs: ["build"]
  # a failed scan uploads no report and would look like "all findings fixed"
  allow_failure: false
  variables:
    CS_IMAGE: ${COMMIT_IMAGE}
    # only findings with an available fix are reported (unfixable kernel-header CVEs etc. are noise for a container)
    CS_IGNORE_UNFIXED: "true"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy:prod:
  extends: .deploy_template_argocd
  needs: ["build"]
  stage: deploy
  variables:
    APP: vulners_mcp
    TARGET_IMAGE: ${COMMIT_IMAGE}

sync:prod:api:
  extends: .deploy_cluster_sync_template
  stage: sync
  needs: ["deploy:prod"]